name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build and validate config
        run: |
          go build -o /tmp/fortmox ./cmd/fortmox
          /tmp/fortmox config validate

  build:
    name: Build Linux ${{ matrix.goarch }}
    needs: go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/fortmox-linux-${GOARCH}" ./cmd/fortmox
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: fortmox-linux-${{ matrix.goarch }}
          path: dist/fortmox-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile scripts
        run: python -m compileall -q scripts
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test read-only and dry-run commands
        run: |
          python scripts/config-manager.py
          python scripts/detect-hardware.py
          python scripts/deploy.py
          python scripts/deploy-vms.py --dry-run
          python scripts/gpu-setup.py
          python scripts/power-management.py --dry-run
          python scripts/verify.py